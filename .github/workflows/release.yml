name: Release desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            key: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            key: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            key: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            key: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system packages
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
      - name: Collect named installers
        shell: bash
        run: |
          mkdir -p release-upload
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release-upload/${{ matrix.key }}-$(basename "$file")"
          done
          test -n "$(find release-upload -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: release-upload/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Build checksums and latest manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/make-release-manifest.mjs release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'v0.1.0' }}
          name: Document History Bridge ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/macos-*
            release-assets/windows-*
            release-assets/linux-*
            release-assets/SHA256SUMS
            release-assets/latest.json

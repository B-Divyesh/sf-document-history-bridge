[package]
name = "document-history-bridge"
version = "0.1.1"
description = "Readable local history for office documents"
authors = ["Sociobot"]
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-document-history-bridge"
edition = "2021"

[lib]
name = "document_history_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "document-history-bridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.2", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-opener = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "4.5", default-features = false, features = ["deflate"] }
regex = "1"
html-escape = "0.2"
pdf-extract = "0.9"
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
